window.storage = {
  get: async function(key) {
    try { const v = localStorage.getItem('codex_'+key); if(v===null) throw new Error('not found'); return {key,value:v}; } catch(e){throw e;}
  },
  set: async function(key, value) {
    try { localStorage.setItem('codex_'+key,value); return {key,value}; } catch(e){throw e;}
  },
  delete: async function(key) { localStorage.removeItem('codex_'+key); return {key,deleted:true}; },
  list: async function(prefix) {
    const keys=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k.startsWith('codex_'+(prefix||''))) keys.push(k.replace('codex_',''));
    }
    return {keys,prefix};
  }
};

/* Look up weapon data by name (fuzzy) */
function lookupWeapon(name) {
  if (!name) return null;
  const lower = name.toLowerCase().trim();

  if (ARMOR_TABLE[lower]) return ARMOR_TABLE[lower];
